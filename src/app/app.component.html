<div class="d-flex flex-column min-vh-100">
  <header id="main-header" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top">
    <div class="container">
      <a routerLink="/" class="navbar-brand fw-bold">
        🎫 Elektroniczny Bilet Miejski
      </a>

      <button #navbarToggler class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav" #navbarNav>
        <ul class="navbar-nav ms-auto text-center text-lg-start"
            (click)="navbarNav.classList.contains('show') ? navbarToggler.click() : null">

          <li *ngIf="!authService.isLoggedIn" class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active-link">Logowanie</a>
          </li>
          <li *ngIf="!authService.isLoggedIn" class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active-link">Rejestracja</a>
          </li>

          <li *ngIf="authService.isLoggedIn && authService.isUser" class="nav-item">
            <a class="nav-link" routerLink="/tickets" routerLinkActive="active-link">Moje bilety</a>
          </li>
          <li *ngIf="authService.isLoggedIn && authService.isUser" class="nav-item">
            <a class="nav-link" routerLink="/offer" routerLinkActive="active-link">Oferty</a>
          </li>

          <li *ngIf="authService.isLoggedIn && authService.isUser" class="nav-item py-2 px-lg-3 text-warning fw-bold">
            ⭐ {{ pointsBalance }} pts
          </li>

          <li *ngIf="authService.isLoggedIn && authService.isController" class="nav-item">
            <a class="nav-link" routerLink="/check-ticket" routerLinkActive="active-link">Sprawdź bilet</a>
          </li>
          <li *ngIf="authService.isLoggedIn && authService.isAdmin" class="nav-item">
            <a class="nav-link" routerLink="/manage-users" routerLinkActive="active-link">Użytkownicy</a>
          </li>
          <li *ngIf="authService.isLoggedIn && authService.isAdmin" class="nav-item">
            <a class="nav-link" routerLink="/manage-tickets" routerLinkActive="active-link">Oferta</a>
          </li>

          <li *ngIf="authService.isLoggedIn" class="nav-item border-top border-light mt-2 mt-lg-0 pt-2 pt-lg-0 ms-lg-2">
            <a class="nav-link btn btn-outline-light btn-sm text-white px-3" (click)="authService.logout()">
              Wyloguj się
            </a>
          </li>
        </ul>
      </div>
    </div>
  </header>

  <main class="flex-grow-1 py-4 container" style="margin-top: 80px;">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <small>© 2025 Miasto Wrocław.</small>
    </div>
  </footer>
</div>
