<h1 class="text-center">Rejestracja</h1>
<form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm" novalidate class="w-25 mx-auto mt-4 p-4 border rounded">

  <div class="mb-3">
    <label for="username" class="form-label">Nazwa użytkownika</label>
    <input
      id="username"
      name="username"
      type="text"
      [(ngModel)]="username"
      #usernameInput="ngModel"
      required
      minlength="4"
      pattern="^[a-zA-Z0-9]+$"
      placeholder="Wpisz nazwę użytkownika..."
      class="form-control"
      [class.is-invalid]="usernameInput.invalid && (usernameInput.dirty || usernameInput.touched)"
      [class.is-valid]="usernameInput.valid && (usernameInput.dirty || usernameInput.touched)"
    />
    <div *ngIf="usernameInput.invalid && (usernameInput.dirty || usernameInput.touched)" class="invalid-feedback">
      <div *ngIf="usernameInput.errors?.['required']">Nazwa użytkownika jest wymagana.</div>
      <div *ngIf="usernameInput.errors?.['minlength']">Nazwa użytkownika musi mieć co najmniej 4 znaki.</div>
      <div *ngIf="usernameInput.errors?.['pattern']">Nazwa użytkownika może zawierać tylko litery i cyfry.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Hasło</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      #passwordInput="ngModel"
      required
      minlength="8"
      pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$"
      placeholder="Wpisz hasło..."
      class="form-control"
      [class.is-invalid]="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)"
      [class.is-valid]="passwordInput.valid && (passwordInput.dirty || passwordInput.touched)"
      title="Hasło musi mieć co najmniej 8 znaków, zawierać jedną wielką literę, jedną cyfrę oraz jeden znak specjalny."
    />
    <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="invalid-feedback">
      <div *ngIf="passwordInput.errors?.['required']">Hasło jest wymagane.</div>
      <div *ngIf="passwordInput.errors?.['minlength']">Hasło musi mieć co najmniej 8 znaków.</div>
      <div *ngIf="passwordInput.errors?.['pattern']">
        Hasło musi zawierać wielką literę, cyfrę oraz znak specjalny.
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
    Zarejestruj się
  </button>

  <p *ngIf="message" [style.color]="message.includes('success') ? 'green' : 'orange'" class="mt-3 fw-semibold">
    {{ message }}
  </p>
</form>
