<div class="container mt-5">
  <h2 class="text-center mb-4">Sprawdź bilet</h2>

  <div class="card shadow-sm p-4 mx-auto" style="max-width: 520px;">
    <div *ngIf="resultMessage" class="alert text-center"
         [ngClass]="{
       'alert-success': resultType === 'success',
       'alert-danger': resultType === 'danger',
       'alert-warning': resultType === 'warning',
       'alert-info': resultType === 'info'
     }">
      {{ resultMessage }}
    </div>

    <div class="scanner">
      <video #video playsinline autoplay muted></video>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button
        type="button"
        class="btn btn-primary"
        (click)="startScanner()"
        [disabled]="startingScanner || !vehicleId?.trim()"
      >
        Uruchom kamerę
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="stopScanner()"
        [disabled]="!scannerActive"
      >
        Zatrzymaj
      </button>
    </div>

    <div class="mt-3">
      <label for="vehicleId" class="form-label">Numer pojazdu</label>
      <input
        id="vehicleId"
        class="form-control"
        [(ngModel)]="vehicleId"
        (ngModelChange)="onVehicleIdChange()"
        placeholder="Np. 123"
        maxlength="6"
      />
      <div class="form-text">Po wpisaniu numeru pojazdu możesz uruchomić kamerę.</div>
    </div>
  </div>
</div>
